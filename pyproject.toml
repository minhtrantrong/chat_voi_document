[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-voi-document"
version = "0.1.0"
description = "Upload PDF và chat với AI bằng Qdrant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.42",
    "qdrant-client>=1.12",
    "openai>=1.50",
    "pymupdf>=1.24",
    "pydantic-settings>=2.6",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: cần Qdrant đang chạy",
    "slow: test chậm, không chặn CI",
]
addopts = "-ra"

[tool.coverage.run]
omit = ["app/main.py", "app/shared/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/shared"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
